<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CapyFilms</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="dist/main.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="header__brand">
      <img src="images/logo.png" alt="Capy Films logo" class="header__logo" />
      <h1 class="header__title">
        <object data="images/titleText.png" type="image/png" class="header__title-image" aria-label="Capy Films">Capy Films</object>
      </h1>
    </div>
    <div class="header__filters">
      <div class="favorites-counter" id="favorites-counter">
        <span class="favorites-counter__icon">♥</span>
        <span class="favorites-counter__number" id="favorites-counter-number">0</span>
      </div>
      <button
        type="button"
        id="language-button"
        class="filters__language-button"
        aria-label="Change language"
      >
        EN
      </button>
    </div>
  </header>

  <section class="ads hidden" id="ads-section" aria-live="polite">
    <button type="button" class="ads__arrow ads__arrow--left" id="ads-prev" aria-label="Previous ad">‹</button>
    <div class="ads__slide" id="ads-slide">
      <!-- Filled in by services/advertisementsService.ts (via orchestrateServices). Hidden if the service fails. -->
    </div>
    <button type="button" class="ads__arrow ads__arrow--right" id="ads-next" aria-label="Next ad">›</button>
    <div class="ads__dots" id="ads-dots"></div>
  </section>

  <div class="search-bar">
    <input
      type="text"
      id="search-input"
      class="filters__input"
      placeholder="Buscar película..."
      data-i18n-placeholder="search"
    />
    <select id="category-filter" class="filters__select">
      <option value="all" data-i18n="all">Todas las categorías</option>
    </select>
  </div>

  <main class="container" id="movies-container">
    <!-- Cards are generated dynamically from movies.json (see src/main.ts) -->
  </main>

  <footer class="footer">
    <p data-i18n="footer">Catálogo de películas — CapyFilms</p>
  </footer>

  <div class="modal-overlay" id="modal-overlay">
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <button class="modal__close" id="modal-close" aria-label="Cerrar" data-i18n-aria="close">✕</button>
      <img class="modal__image" id="modal-image" src="" alt="" />
      <div class="modal__category" id="modal-category">Categoría</div>
      <h2 class="modal__title" id="modal-title">Título de la película</h2>
      <p class="modal__description" id="modal-description"></p>
      <ul class="modal__details">
        <li><strong data-i18n="year">Año:</strong> <span id="modal-year"></span></li>
        <li><strong data-i18n="director">Director:</strong> <span id="modal-director"></span></li>
        <li><strong data-i18n="duration">Duración:</strong> <span id="modal-duration"></span> <span data-i18n="min">min</span></li>
        <li><strong data-i18n="rating">Calificación:</strong> ⭐ <span id="modal-rating"></span></li>
      </ul>
    </div>

    <aside class="modal-reviews hidden" id="modal-reviews" aria-live="polite">
      <!-- Reviews for the open movie (services/reviewsService.ts). Hidden if the service failed or there are no reviews for this movie. -->
    </aside>
  </div>
</body>
</html>
